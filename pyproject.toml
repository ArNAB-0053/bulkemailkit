[project]
name = "email-automation-toolkit"
version = "0.1.0"
description = "A local, Mailpit-first tool for sending individual email messages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
email-tool = "email_tool.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".uv-cache", ".uv-python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
